<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador IA + Airtable</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Generador de código con IA</h1>
      <label for="prompt">Prompt</label>
      <textarea
        id="prompt"
        placeholder="Escribe una app web simple, por ejemplo: un temporizador pomodoro con HTML/CSS/JS"
      ></textarea>
      <button id="runButton" type="button">Ejecutar</button>
      <p id="status" aria-live="polite"></p>

      <section>
        <h2>Código generado</h2>
        <pre id="codeOutput"></pre>
      </section>

      <section>
        <h2>Resultado</h2>
        <iframe id="preview" title="Vista previa segura" sandbox="allow-scripts"></iframe>
      </section>
    </main>

    <script>
      const promptInput = document.getElementById('prompt');
      const runButton = document.getElementById('runButton');
      const preview = document.getElementById('preview');
      const status = document.getElementById('status');
      const codeOutput = document.getElementById('codeOutput');

      runButton.addEventListener('click', async () => {
        const prompt = promptInput.value.trim();

        if (!prompt) {
          status.textContent = 'Ingresá un prompt antes de ejecutar.';
          return;
        }

        runButton.disabled = true;
        status.textContent = 'Guardando y generando...';
        codeOutput.textContent = '';
        preview.srcdoc = '';

        try {
          const response = await fetch('/api/generate', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ prompt })
          });

          const payload = await response.json();

          if (!response.ok) {
            throw new Error(payload.error || 'No se pudo generar el código.');
          }

          codeOutput.textContent = payload.code;
          preview.srcdoc = payload.code;
          status.textContent = 'Prompt y respuesta guardados en Airtable.';
        } catch (error) {
          status.textContent = error.message || 'Error inesperado.';
        } finally {
          runButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
